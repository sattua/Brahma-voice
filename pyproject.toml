[project]
name = "brahma"
version = "0.1.0"
description = "Turn a told story into a graphic novel whose panels stay visually consistent and whose pages open in an image editor."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
brahma = "brahma.cli:main"
brahma-mcp = "mcp_server.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["brahma*", "mcp_server*"]

[tool.setuptools.package-data]
"brahma.images" = ["workflows/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
